  - title: Pokoj
    path: pokoj
    icon: mdi:sofa
    subview: true
    cards: []
    badges:
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            entity: sensor.th05f_pokoj_9434_temperature
            content: >-
              {{states('sensor.th05f_pokoj_9434_temperature') | float | round(1)
              | replace(".",",") }} °C
            icon: mdi:home-thermometer-outline
            icon_color: |2

                {% set tempe = states('sensor.th05f_pokoj_9434_temperature') | float %}
                {% if 0 < tempe <= 4 %}  blue
                {% elif 4 < tempe <= 10  %}  cyan
                {% elif 10 < tempe <= 16  %}  green
                {% elif 16 < tempe <= 18  %}  yellow
                {% elif 18 < tempe <= 20  %}  orange
                {% elif 20 < tempe <= 22  %}  red
                {% endif %}
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.th05f_pokoj_9434_humidity
            name: Domek
            icon: mdi:home-flood
            icon_color: blue
          - type: template
            entity: sensor.particulate_matter_2_5mm_concentration
            content: >-
              {{states('sensor.particulate_matter_2_5mm_concentration') | float
              | round(1) | replace(".",",") }} µg/m³
            icon: mdi:blur
            icon_color: |2

                {% set tempe = states('sensor.particulate_matter_2_5mm_concentration') | float %}
                {% if 0 < tempe <= 30 %}  green
                {% elif 30 < tempe <= 90  %}  yellow
                {% elif 90 < tempe %}  red
                {% endif %}
            tap_action:
              action: more-info
        alignment: center
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.light_sensor
        color: orange
