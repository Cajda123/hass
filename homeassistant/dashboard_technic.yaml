                  {% if p >= 1200 %}mdi:water-boiler

                  {% elif p >= 120 %}mdi:dishwasher

                  {% elif p >= 20 %}mdi:water-pump

                  {% elif p >= 5 %}mdi:weather-windy

                  {% elif p > 1 %}mdi:pause-circle

                  {% else %}mdi:check-circle{% endif %}
                badge_color: >-
                  {% set p = states('sensor.grillplats_plug_vykon_3') | float(0)
                  %}

                  {% if p >= 1200 %}red

                  {% elif p >= 120 %}blue

                  {% elif p >= 20 %}cyan

                  {% elif p >= 5 %}purple

                  {% elif p > 1 %}amber

                  {% else %}green{% endif %}
              - type: custom:mushroom-template-card
                entity: switch.plug
                primary: Kávovar
                secondary: |-
                  {% set p = states('sensor.power_3') | float(0) %}
                  {% if is_state('switch.plug', 'off') %}
                    Vypnutá zásuvka
                  {% elif p >= 900 %}
                    ☕ Vaří kávu · {{ p | round(0) }} W
                  {% elif p >= 100 %}
                    🔥 Nahřívá se · {{ p | round(0) }} W
                  {% elif p > 6 %}
                    💧 Proplach / udržování teploty · {{ p | round(0) }} W
                  {% else %}
                    ✅ Připraven
                  {% endif %}
                icon: mdi:coffee-maker
                icon_color: |-
                  {% set p = states('sensor.power_3') | float(0) %}
                  {% if p > 50 %}brown
                  {% elif p > 6 %}amber
                  {% elif is_state('switch.plug', 'off') %}red
                  {% else %}grey{% endif %}
                multiline_secondary: true
                tap_action:
                  action: more-info
                hold_action:
                  action: toggle
                badge_icon: |-
                  {% set p = states('sensor.power_3') | float(0) %}
                  {% if p >= 900 %}mdi:coffee
                  {% elif p >= 100 %}mdi:thermometer-high
                  {% elif p > 6 %}mdi:water-sync
                  {% else %}mdi:check-circle{% endif %}
                badge_color: |-
                  {% set p = states('sensor.power_3') | float(0) %}
                  {% if p >= 900 %}brown
                  {% elif p >= 100 %}red
                  {% elif p > 6 %}blue
                  {% else %}green{% endif %}
              - type: custom:mushroom-template-card
                primary: Trouba
                secondary: Měření spotřeby se připravuje
                icon: mdi:stove
                icon_color: grey
                tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: Sporák
                secondary: Měření spotřeby se připravuje
                icon: mdi:pot-steam-outline
                icon_color: grey
                tap_action:
                  action: none
      - type: grid
        cards: []
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Krátký komentář
            icon: mdi:comment-text-outline
          - type: markdown
            content: >-
              {{ states('sensor.ems_ai_komentar') | default('EMS zatím nemá nový
              komentář.', true) }}
    cards: []
