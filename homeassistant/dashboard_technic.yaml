button_card_templates:
  ems_base:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    styles:
      card:
        - background: linear-gradient(145deg, rgba(20,35,50,0.96), rgba(10,20,32,0.96))
        - border: 1px solid rgba(145,180,220,0.12)
        - border-radius: 22px
        - box-shadow: 0 10px 30px rgba(0,0,0,0.28)
        - padding: 16px
        - color: '#eef6ff'
        - font-family: Inter, Roboto, Arial, sans-serif
      grid:
        - grid-template-areas: '''main'''
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        main:
          - align-self: start
          - justify-self: stretch
  ems_header:
    template: ems_base
    styles:
      card:
        - background: linear-gradient(145deg, rgba(12,24,38,0.92), rgba(5,14,24,0.96))
        - min-height: 76px
    custom_fields:
      main: |
        [[[ 
          const d = new Date();
          const date = d.toLocaleDateString('cs-CZ',{weekday:'long', day:'numeric', month:'long'});
          const time = d.toLocaleTimeString('cs-CZ',{hour:'2-digit', minute:'2-digit'});
          return `<div style="display:flex;align-items:center;justify-content:space-between;gap:18px">
            <div style="display:flex;align-items:center;gap:14px">
              <div style="font-size:42px;line-height:1">🏠</div>
              <div><div style="font-size:26px;font-weight:850;letter-spacing:.04em">NÁŠ DŮM</div>
              <div style="font-size:15px;color:#b9c8dc;margin-top:5px">${date} · ${time}</div></div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;color:#57e37f;font-weight:750">
              <ha-icon icon="mdi:shield-check" style="width:32px;height:32px"></ha-icon>
              <div><div>EMS chrání dům</div><div style="font-size:13px;color:#c6d2e2;font-weight:500">Všechno je pod kontrolou</div></div>
            </div>
          </div>`;
        ]]]
  ems_hero:
    template: ems_base
    styles:
      card:
        - min-height: 175px
        - padding: 0
        - overflow: hidden
        - background: linear-gradient(135deg, rgba(16,132,62,0.95), rgba(8,70,42,0.94))
    custom_fields:
      main: |
        [[[ 
          const soc = parseFloat(states['sensor.ems_battery_soc']?.state || 0);
          const min = parseFloat(states['sensor.ems_battery_effective_minimum_soc']?.state || 45);
          const pv = parseFloat(states['sensor.ems_pv_power']?.state || 0);
          const cheap = states['binary_sensor.ems_cheap_grid_usable']?.state === 'on';
          const emergency = states['binary_sensor.ems_emergency_charge_active']?.state === 'on';
          let title='Máme dost energie', sub='Můžeš klidně použít pračku, myčku nebo troubu.', mood='😊', glow='#32e36b';
          if (emergency || soc <= min) { title='Šetříme baterky'; sub='Velké spotřebiče teď raději nepouštěj.'; mood='😐'; glow='#ff4d4d'; }
          else if (cheap) { title='Levný tarif je aktivní'; sub='Větší spotřebiče jsou teď v pohodě.'; mood='🙂'; glow='#3aa0ff'; }
          else if (pv < 800 && soc < 70) { title='Energie je tak akorát'; sub='Pusť maximálně jednu větší věc najednou.'; mood='🙂'; glow='#ffd24a'; }
          return `<div style="position:relative;min-height:175px;border-radius:22px;overflow:hidden">
            <img src="/local/ems-ui3/hero_house.png" style="position:absolute;right:0;top:0;height:100%;width:60%;object-fit:cover;opacity:.55;mask-image:linear-gradient(to right, transparent, black 35%)">
            <div style="position:absolute;inset:0;background:radial-gradient(circle at 10% 50%, ${glow}55, transparent 34%), linear-gradient(90deg, rgba(9,48,34,.96) 0%, rgba(9,70,40,.82) 52%, rgba(9,30,30,.25) 100%)"></div>
            <div style="position:relative;z-index:2;display:flex;align-items:center;gap:26px;padding:28px 32px;height:100%">
              <div style="width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;background:radial-gradient(circle at 30% 25%, #a8ffb4, ${glow});box-shadow:0 0 45px ${glow}80">${mood}</div>
              <div><div style="font-size:30px;font-weight:900;letter-spacing:-.02em">${title}</div>
              <div style="font-size:16px;color:#eef6ff;margin-top:9px;line-height:1.45">${sub}<br>EMS hlídá dům automaticky.</div></div>
            </div>
          </div>`;
        ]]]
  ems_section_title:
    template: ems_base
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 4px 4px 0 4px
    custom_fields:
      main: >
        [[[ return `<div
        style="font-size:16px;font-weight:850;color:#b7d7ff;letter-spacing:.04em;text-transform:uppercase">${variables.title}</div>`;
        ]]]
  ems_appliance:
    template: ems_base
    styles:
      card:
        - height: 132px
        - padding: 12px
        - background: linear-gradient(160deg, rgba(28,45,65,.98), rgba(13,25,39,.98))
    custom_fields:
      main: |
        [[[ 
          const ok = variables.ok;
          const img = variables.img;
          const title = variables.title;
          const desc = variables.desc || (ok ? 'Klidně spusť' : 'Raději počkej');
          return `<div style="height:100%;display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;filter:${ok?'none':'grayscale(1) opacity(.72)'}">
            <img src="${img}" style="width:58px;height:58px;object-fit:contain">
            <div><div style="font-size:15px;color:#eaf4ff">${title}</div>
            <div style="font-size:22px;font-weight:900;color:${ok?'#3cff77':'#ff6464'};margin-top:2px">${ok?'ANO':'NE'}</div>
            <div style="font-size:12px;color:#c2cfde;margin-top:8px">${desc}</div></div>
          </div>`;
        ]]]
  ems_metric:
    template: ems_base
    styles:
      card:
        - min-height: 145px
        - text-align: center
    custom_fields:
      main: >
        [[[ return `<div
        style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:100%">
          <img src="${variables.img}" style="height:48px;width:58px;object-fit:contain">
          <div style="font-size:14px;color:#cfe0f4">${variables.title}</div>
          <div style="font-size:25px;font-weight:900;color:#ffffff">${variables.value}</div>
          <div style="font-size:13px;color:${variables.color || '#43e36f'}">${variables.sub}</div>
        </div>`; ]]]
  ems_car:
    template: ems_base
    styles:
      card:
        - min-height: 138px
        - padding: 12px
    custom_fields:
      main: |
        [[[ 
          const soc = Math.max(0, Math.min(100, parseFloat(variables.soc || 0)));
          const charging = variables.charging;
          return `<div style="display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center">
            <div style="position:relative"><div style="position:absolute;left:12px;top:8px;width:15px;height:15px;border-radius:50%;background:${charging?'#37e66c':'#6f7e90'};box-shadow:0 0 16px ${charging?'#37e66c':'transparent'}"></div><img src="${variables.img}" style="width:100%;height:92px;object-fit:contain;filter:${charging?'drop-shadow(0 0 14px rgba(54,230,108,.28))':'none'}"></div>
            <div><div style="font-size:22px;font-weight:900">${variables.name}</div>
            <div style="font-size:13px;color:#c8d6e7;margin-top:2px">${variables.status}</div>
            <div style="margin-top:15px;height:16px;border-radius:999px;background:#203145;overflow:hidden"><div style="height:100%;width:${soc}%;background:linear-gradient(90deg,#22bd5a,#5df07b);border-radius:999px"></div></div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px"><span style="font-size:13px;color:#c8d6e7">${variables.need}</span><span style="font-size:18px;font-weight:850">${soc.toFixed(0)} %</span></div></div>
          </div>`;
        ]]]
  ems_action:
    template: ems_base
    styles:
      card:
        - min-height: 92px
        - text-align: center
        - cursor: pointer
    custom_fields:
      main: >
        [[[ return `<div
        style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><div
        style="font-size:32px">${variables.icon}</div><div
        style="font-size:13px;color:#eef6ff;line-height:1.25">${variables.title}</div></div>`;
        ]]]
  ems_list:
    template: ems_base
    custom_fields:
      main: |
        [[[ return variables.html; ]]]
  fuel_price:
    show_icon: false
    show_name: true
    show_state: true
    styles:
      card:
        - padding: 12px
      name:
        - font-size: 14px
        - opacity: 0.7
      state:
        - font-size: 42px
        - font-weight: bold
  fuel_card:
    show_icon: false
    show_name: true
    show_state: false
    custom_fields:
      liters: |
        [[[
          let money = states[entity.entity_id].state;
          let price = states[variables.price_entity].state;

          if (!money || !price || price == 0) return "-";

          let liters = (money / price);
          return liters.toFixed(1) + " l";
        ]]]
      progress: |
        [[[
          let money = states[entity.entity_id].state;
          let limit = states[variables.limit_entity].state;

          if (!money || !limit) return 0;

          return (money / limit) * 100;
        ]]]
    styles:
      card:
        - padding: 12px
      name:
        - font-size: 16px
      custom_fields:
        liters:
          - font-size: 28px
          - font-weight: bold
        progress:
          - height: 6px
          - background: |
              [[[
                let p = (states[entity.entity_id].state / states[variables.limit_entity].state) * 100;
                return `linear-gradient(90deg, var(--primary-color) ${p}%, #444 ${p}%)`;
              ]]]
header_cards:
  cards:
    - type: custom:mushroom-chips-card
      chips:
        - type: weather
          entity: weather.zahrada
          show_conditions: false
          show_temperature: true
        - type: entity
          icon: none
          content: |
            {{ states("sensor.time") }}
views:
  - type: sections
    max_columns: 3
    path: home
    dense_section_placement: true
    title: Home
    sections:
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.vyvoz_popelnice
                below: 3
            card:
              type: picture-elements
              image: /local/waste_bin.png
              elements:
                - type: state-label
                  entity: sensor.vyvoz_popelnice_text
                  style:
                    position: absolute
                    transform: translate(-50%,-50%)
                    top: 100%
                    left: 50%
                    font-size: 2v
                    color: '#FFFFFF'
            grid_options:
              columns: 5
              rows: 4
          - show_state: false
            show_name: false
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            aspect_ratio: '16:9'
            entity: camera.pergola
            camera_image: camera.zahrada_horni_mainstream_2
            view_layout:
              grid-area: cams1
          - type: custom:mushroom-light-card
            entity: light.domek_vchod
            name: Vchod
            fill_container: false
            use_light_color: true
            show_color_temp_control: true
            show_brightness_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-light-card
            entity: light.cesta
            icon_color: accent
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true
            icon: phu:bulb-group-pillar-turaco-short-tall
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        cards:
          - show_state: false
            show_name: false
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            aspect_ratio: '16:9'
            entity: camera.domek
            camera_image: camera.domek_mainstream
            view_layout:
              grid-area: cams2
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: light.sw_cesta
            grid_options:
              columns: 12
              rows: 2
            name: Cesta
      - type: grid
        cards:
          - type: iframe
            url: >-
              https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=default&metricWind=default&zoom=5&overlay=radar&product=radar&level=surface&lat=49.497&lon=14.897
            aspect_ratio: 80%
            grid_options:
              columns: full
              rows: 8
            view_layout:
              grid-area: pocasi
      - type: grid
        cards:
          - type: custom:llmvision-card
            entity: calendar.llm_vision_timeline
            number_of_hours: 24
            number_of_events: 5
            language: cz
            time_format: 24h
            grid_options:
              columns: 12
              rows: 8
    badges:
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            entity: sensor.teplota_zahrada_pokoj_temperature
            content: >-
              {{states('sensor.teplota_zahrada_pokoj_temperature') | float |
              round(1) | replace(".",",") }} °C
            icon: mdi:home-thermometer-outline
            icon_color: |2

                {% set tempe = states('sensor.teplota_zahrada_pokoj_temperature') | float %}
                {% if 0 < tempe <= 4 %}  blue
                {% elif 4 < tempe <= 10  %}  cyan
                {% elif 10 < tempe <= 16  %}  green
                {% elif 16 < tempe <= 18  %}  yellow
                {% elif 18 < tempe <= 20  %}  orange
                {% elif 20 < tempe <= 22  %}  red
                {% endif %}
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.teplota_zahrada_pokoj_humidity
            name: Domek
            icon: mdi:home-flood
            icon_color: blue
          - type: entity
            entity: sensor.teplota_venku_temperature
            icon: phu:outside-temp
            icon_color: amber
          - type: entity
            entity: sensor.teplota_venku_humidity
            icon_color: blue
            icon: phu:humidity
          - type: entity
            entity: sensor.rainviewer_radar_rain_intensity
            tap_action:
              action: more-info
            icon: mdi:weather-rainy
        alignment: center
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sensor.power_meter_vstup_power
            name: Domek
            use_entity_picture: true
            icon: mdi:transmission-tower-export
            icon_color: indigo
          - type: entity
            entity: sensor.vykon_solary
            name: Domek
            icon: mdi:solar-power-variant-outline
            icon_color: amber
          - type: entity
            entity: sensor.battery_power_total
            icon: mdi:home-battery-outline
            icon_color: brown
          - type: entity
            entity: sensor.load_power_all
            icon: mdi:home-lightning-bolt
            icon_color: blue-grey
          - type: light
            entity: light.domek_okno
            content_info: none
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            use_light_color: true
          - type: light
            entity: light.domek_stred
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            content_info: none
            use_light_color: true
          - type: light
            entity: light.domek_dvere
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            content_info: none
            use_light_color: true
        alignment: center
        view_layout:
          grid-area: header2
    icon: mdi:home
    cards: []
  - title: Přehled
    path: test
    cards:
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
                color: #EFEFEF;
                min-height:100%;
                background: url({{state_attr("camera.domek","entity_picture")}});
                background-size: 100% 200%;
                background-repeat: no-repeat;
                background-position:right -0px;
                background-blend-mode: multiply;
            }
        cards:
          - type: custom:mushroom-template-card
            primary: Pokoj
            secondary: >-
              {{ states('sensor.teplota_zahrada_pokoj_temperature') | float |
              round(1)}}°C -

              {{ states('sensor.teplota_zahrada_pokoj_humidity') | float |
              round(0)}}%
            icon: mdi:sofa-outline
            entity: light.svetla_nistnost
            icon_color: |-
              {% if is_state('light.svetla_nistnost', 'on') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: navigate
              navigation_path: pokoj
            card_mod:
              style:
                mushroom-state-info$: |
                  .container {
                    display: inline-block;
                    width: 78px;
                    border: 1px solid #000;
                    border-radius: 7px;
                    background: rgba(0,0,0,0.5);
                  }
          - type: custom:mushroom-template-card
            primary: '|'
            card_mod:
              style: |
                ha-card {
                 border: 0px; box-shadow: none;
                   }
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: light.domek_okno
                icon: mdi:lightbulb
                icon_color: >
                  {{ '#%02x%02x%02x' % state_attr("light.domek_okno",
                  'rgb_color') if states("light.domek_okno") == 'on' else
                  'disabled' }}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
              - type: template
                entity: light.domek_stred
                icon: mdi:lightbulb
                icon_color: >
                  {{ '#%02x%02x%02x' % state_attr("light.domek_stred",
                  'rgb_color') if states("light.domek_stred") == 'on' else
                  'disabled' }}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
              - type: template
                entity: light.domek_dvere
                icon: mdi:lightbulb
                icon_color: >
                  {{ '#%02x%02x%02x' % state_attr("light.domek_dvere",
                  'rgb_color') if states("light.domek_dvere") == 'on' else
                  'disabled' }}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
              - type: template
                entity: binary_sensor.pokoj_okno_contact
                icon: |-
                  {% if is_state('binary_sensor.pokoj_okno_contact', 'on') %}
                    phu:lift-in-window-open2
                  {% else %}
                    phu:lift-in-window-closed
                  {% endif %}
                icon_color: |-
                  {% if is_state('binary_sensor.pokoj_okno_contact', 'on') %}
                    red
                  {% else %}
                    white
                  {% endif %}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
              - type: template
                entity: binary_sensor.dvere_domek_contact
                icon: |-
                  {% if is_state('binary_sensor.dvere_domek_contact', 'on') %}
                    phu:panel-door-open
                  {% else %}
                    phu:panel-door-close
                  {% endif %}
                    
                icon_color: |-
                  {% if is_state('binary_sensor.dvere_domek_contact', 'on') %}
                    red
                  {% else %}
                    white
                  {% endif %}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
              - type: template
                entity: cover.roleta_postel
                icon: mdi:blinds-horizontal
                content_info: none
                icon_color: |-
                  {% if is_state('cover.roleta_postel', 'closed') %}
                    red
                  {% else %}
                    white
                  {% endif %}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
                tap-action: toggle
                hold-action: more-info
              - type: template
                entity: climate.pokoj
                icon: |-
                  {% if is_state('switch.rele_16ch_tech_pin_14_2', 'on') %}
                    mdi:heating-coil
                  {% else %}
                    mdi:heating-coil
                  {% endif %}
                    
                icon_color: |-
                  {% if (is_state('climate.pokoj', 'heat')) %}
                    {% set value = state_attr('climate.pokoj','power_percent') %}
                    {% if value <= 50 %}
                        {% set red = (255 * (value / 50)) | int %}
                        {% set blue = 255 %}
                      {% else %}
                         {% set red = 255 %}
                        {% set blue = (255 * (1 - (value - 50) / 50)) | int %}
                    {% endif %}
                    {{ '#%02x%02x%02x' % (red,0,blue) }}
                  {% else %}
                    white
                  {% endif %}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
            alignment: center
            card_mod:
              style: |
                ha-card {
                  margin: 0px 5px 5px;
                #  height: 100px;
                  --chip-background: rgba(0,0,0,0.7);
                  --chip-border-width: 0;
                  --chip-box-shadow: none;
                  --chip-border-radius: 12px;
                  --chip-height: 35px;
                }
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
                color: #EFEFEF;
                min-height:100%;
                background: url({{state_attr("camera.kuchyn","entity_picture")}});
                background-size: 100% 200%;
                background-repeat: no-repeat;
                background-position:center -50px;
                background-blend-mode: multiply;
            }
        cards:
          - type: custom:mushroom-template-card
            primary: Kuchyně
            secondary: |-
              {{ states('sensor.lcd_teplomer_kuchyn_temperature') }}°C -
              {{ states('sensor.lcd_teplomer_kuchyn_humidity') }}%
            icon: phu:rooms-kitchen
            entity: light.kuchyn_linka
            icon_color: |-
              {% if is_state('binary_sensor.pir_kuchyn_occupancy', 'on') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: navigate
              navigation_path: kuchyn
            card_mod:
              style:
                mushroom-state-info$: |
                  .container {
                    display: inline-block;
                    width: 78px;
                    border: 1px solid #000;
                    border-radius: 7px;
                    background: rgba(0,0,0,0.5);
                  }
          - type: custom:mushroom-template-card
            primary: '|'
            card_mod:
              style: |
                ha-card {
                 border: 0px; box-shadow: none;
                   }
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: light.kuchyn_linka
                icon: mdi:led-strip-variant
                icon_color: >
                  {{ '#%02x%02x%02x' % state_attr("light.kuchyn_linka",
                  'rgb_color') if states("light.kuchyn_linka") == 'on' else
                  'disabled' }}
                style: |
                  ha-card {
                   border: 0px; box-shadow: none;
                  }
              - type: template
                entity: light.svetlo_kuchyn
                icon: hue:ceiling-aurelle-rect
                icon_color: >
                  {{ '#%02x%02x%02x' % state_attr("light.svetlo_kuchyn",
                  'rgb_color') if states("light.svetlo_kuchyn") == 'on' else
                  'disabled' }}
                style: |
                  ha-card {
